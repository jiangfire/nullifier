server:
  address: ":8080"
  mode: "debug"
  admin_bearer_token: "dev-admin-token"
  cors_allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

crypto:
  vk_path: ""
  issuer_key_path: "issuer_keys.json"
  issuer_rotate_days: 90

db:
  driver: "sqlite"
  path: "anonvote.db"
