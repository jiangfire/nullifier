name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION file ($expected)"
            exit 1
          fi
          echo "releasing $GITHUB_REF_NAME"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./tests)"
          if [ -n "$out" ]; then
            echo "gofmt failed, these files need formatting:"
            echo "$out"
            exit 1
          fi

      - name: Tests
        run: go test ./...

      - name: Coverage gate
        run: bash ./scripts/check-coverage.sh 80 coverage.ci.out

  # 每个平台在它自己的 runner 上原生构建：默认的 sqlite 驱动走 mattn/go-sqlite3，
  # 需要 cgo。CGO_ENABLED=0 的交叉编译产物编译得过，但启动即 FATAL
  # （"go-sqlite3 requires cgo to work"），所以这里绝不能关掉 cgo。
  build:
    name: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: ubuntu-24.04-arm
            os: linux
          - runner: macos-15-intel
            os: darwin
          - runner: macos-latest
            os: darwin
          - runner: windows-latest
            os: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure MinGW is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\mingw64\bin' >> "$GITHUB_PATH"

      # 以 runner 实际架构为准，不写死，避免 macos-latest 之类的标签换了架构后
      # 产物文件名和内容对不上。
      - name: Resolve target
        id: meta
        shell: bash
        run: echo "arch=$(go env GOARCH)" >> "$GITHUB_OUTPUT"

      - name: Build server and CLI
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          arch="${{ steps.meta.outputs.arch }}"
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            ext=".exe"
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/nullifier-server-${{ matrix.os }}-$arch${ext}" ./cmd/server
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/nullifier-cli-${{ matrix.os }}-$arch${ext}" ./cmd/cli
          ./dist/nullifier-cli-${{ matrix.os }}-$arch${ext} version

      # 冒烟测试：产物必须真的能起来。cgo 缺失、动态库缺失、配置解析失败
      # 这类问题在上面的编译步骤里全都看不出来。
      - name: Smoke test the server binary
        shell: bash
        env:
          SERVER_MODE: debug
          DB_DRIVER: sqlite
          DB_PATH: smoke-test.db
        run: |
          set -uo pipefail
          ./dist/nullifier-server-* > smoke.log 2>&1 &
          pid=$!
          sleep 6
          if grep -q "FATAL" smoke.log; then
            echo "server exited with a fatal error:"
            cat smoke.log
            exit 1
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "server exited before the smoke window elapsed:"
            cat smoke.log
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          echo "server stayed up for the smoke window"

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ steps.meta.outputs.arch }}"
          out="nullifier-${{ matrix.os }}-$arch"
          if [ "${{ matrix.os }}" = "windows" ]; then
            # Git Bash 不带 zip，用 PowerShell 压缩；-Path 'dist/*' 会把条目放在归档根目录
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath '$out.zip' -Force"
          else
            # -j 去掉 dist/ 前缀，条目同样落在归档根目录
            zip -j "$out.zip" dist/*
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out.zip" > "$out.zip.sha256"
          else
            # macOS 没有 sha256sum，只有 shasum
            shasum -a 256 "$out.zip" > "$out.zip.sha256"
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ steps.meta.outputs.arch }}
          path: |
            nullifier-*.zip
            nullifier-*.zip.sha256

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 浏览器端 prover 是**构建产物**，不入库（web/.gitignore）。发布流水线必须
      # 自己编一遍 —— v0.1.0 的门户由服务端代加密，不需要它；v0.2.0 的门户在浏览器
      # 里出证明，**没有它就投不了票**。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build the browser-side prover
        run: |
          set -euo pipefail
          mkdir -p web/public
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o web/public/ballot-prover.wasm ./cmd/ballot-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/public/wasm_exec.js

      # 两把 proving key 是秘密材料，不入库、也不该由发布流水线统一发出去
      # （每套部署的 key 必须与服务端那把 verifying key 配对）。
      # 运营方若想让发布的门户开箱即用，把 base64 编码的 key 配成仓库 secret；
      # 没配就发布一个「缺 key」的门户并明确警告 —— 部署时必须自己补。
      - name: Inject the portal proving keys (optional)
        env:
          PROVING_KEY_B64: ${{ secrets.PORTAL_PROVING_KEY_B64 }}
          ELIGIBILITY_PROVING_KEY_B64: ${{ secrets.PORTAL_ELIGIBILITY_PROVING_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$PROVING_KEY_B64" ]; then
            echo "$PROVING_KEY_B64" | base64 -d > web/public/proving.key
            echo "portal proving key injected"
          else
            echo "::warning::PORTAL_PROVING_KEY_B64 is not set - the published portal cannot generate proofs until an operator adds web/public/proving.key"
          fi
          if [ -n "$ELIGIBILITY_PROVING_KEY_B64" ]; then
            echo "$ELIGIBILITY_PROVING_KEY_B64" | base64 -d > web/public/eligibility-proving.key
            echo "portal eligibility proving key injected"
          else
            echo "::warning::PORTAL_ELIGIBILITY_PROVING_KEY_B64 is not set - the published portal cannot claim a credential with an eligibility proof"
          fi

      # 单一版本源：仓库根的 VERSION。前端 package.json 的 version 跟着它走，
      # 免得两处版本号各说各话（review N6）。
      - name: Sync version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          node -e '
            const fs = require("fs");
            const path = "web/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          ' "$version"
          echo "web/package.json version -> $version"

      - name: Lint
        run: pnpm --dir web run lint

      - name: Type check
        run: pnpm --dir web exec tsc --noEmit

      - name: Unit tests
        run: pnpm --dir web run test

      - name: Build portal
        run: pnpm --dir web run build

      # prover 是门户能不能投票的前提，缺了就当构建失败 —— 不要发一个投不了票的门户。
      # proving key 不在此检查范围（它是秘密材料，由运营方补）。
      - name: Check the portal ships the prover
        run: |
          set -euo pipefail
          for asset in ballot-prover.wasm wasm_exec.js; do
            if [ ! -f "web/dist/$asset" ]; then
              echo "web/dist/$asset is missing - the published portal could not generate proofs"
              exit 1
            fi
          done
          echo "the published portal ships ballot-prover.wasm and wasm_exec.js"
          for key in proving.key eligibility-proving.key; do
            if [ ! -f "web/dist/$key" ]; then
              echo "::warning::web/dist/$key is missing - the operator must add it before serving the portal (docs/deployment-checklist.md §6)"
            fi
          done

      - name: Package portal
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          (cd web/dist && zip -r "$GITHUB_WORKSPACE/nullifier-web-${version}.zip" *)
          sha256sum "nullifier-web-${version}.zip" > "nullifier-web-${version}.zip.sha256"

      - name: Upload portal
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            nullifier-web-*.zip
            nullifier-web-*.zip.sha256

  release:
    name: release
    needs: [verify, build, web]
    runs-on: ubuntu-latest
    steps:
      # gh release create --verify-tag 要用本地 git 解析 tag，没有仓库会直接失败
      # （failed to run git: fatal: not a git repository）。fetch-depth: 0 才会把
      # tag 一起取下来。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no artifacts to attach"
            exit 1
          fi
          printf 'attaching %d files\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"
          # 正文用 tag 里的发版说明，而不是自动生成的提交列表：这次发版的边界
          # （内测版、证明链未实现、密文格式 v2）比提交列表重要得多。
          #
          # 从 API 取而不是 git for-each-ref：runner 上的 checkout 可能把注解 tag
          # 落成轻量引用，那样 %(contents) 拿到的是提交信息而不是 tag 说明。
          notes_file="release-notes.md"
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.type')" = "tag" ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha')"
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.message' > "${notes_file}"
          fi
          if [ -s "${notes_file}" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --verify-tag \
              --notes-file "${notes_file}" \
              "${files[@]}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --verify-tag \
              --generate-notes \
              "${files[@]}"
          fi
