name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The browser-side prover acceptance test drives the WASM module through
      # node; without node the test skips itself.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./tests)"
          if [ -n "$out" ]; then
            echo "gofmt failed, these files need formatting:"
            echo "$out"
            exit 1
          fi

      - name: Run Unit/Integration/E2E Tests
        run: go test ./...

      - name: Run Coverage Gate
        run: bash ./scripts/check-coverage.sh 80 coverage.ci.out

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 浏览器端 prover 是**构建产物**，不入库（web/.gitignore）。CI 必须自己编一遍，
      # 否则「发布产物里没有 prover」这种问题要到发版那天才暴露。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build the browser-side prover
        run: |
          set -euo pipefail
          mkdir -p web/public
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
            -o web/public/ballot-prover.wasm ./cmd/ballot-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/public/wasm_exec.js

      - name: Lint
        run: pnpm --dir web run lint

      - name: Type check
        run: pnpm --dir web exec tsc --noEmit

      - name: Unit tests
        run: pnpm --dir web run test

      - name: Build portal
        run: pnpm --dir web run build

      # 门户必须真的带上 prover：没有它，浏览器端出不了证明，门户投不了票。
      # 两把 proving key 是秘密材料，不在 CI 里（由运营方部署时补，见部署清单 §6）。
      - name: Check the portal ships the prover
        run: |
          set -euo pipefail
          for asset in ballot-prover.wasm wasm_exec.js; do
            if [ ! -f "web/dist/$asset" ]; then
              echo "web/dist/$asset is missing - the built portal could not generate proofs"
              exit 1
            fi
          done
          echo "the built portal ships ballot-prover.wasm and wasm_exec.js"

  # 门户端到端测试（T28）：**真浏览器**里走一遍门户的两条路径 ——
  # 领凭证 → 本地生成选票 → 提交 → 查询状态 → 计票，
  # 以及资格路径（导入资格文件 → 匿名领取 → 重复领取被拒）。
  #
  # 这条链路能挖出 node 驱动的单元测试挖不出的跨语言问题
  # （盲签名变体名、字段名、编码、响应式 Proxy）。
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      # 真浏览器：Playwright 自带的 Chromium（--with-deps 装系统依赖）。
      #
      # ⚠️ **浏览器本体要缓存**：它有 120 MiB，在 GitHub runner 上冷下载实测 **12 分钟**
      #    （2026-10-26 首次跑 web-e2e job 时量的）—— 比用例本身（2.2 分钟）长得多。
      #    缓存键按 lockfile 的哈希：依赖变了浏览器版本才可能变，缓存自动失效。
      #    缓存没命中也只是重新下载，**不会让 job 失败**。
      #    ✅ 命中已实测（2026-10-26）：整轮 job 从约 16 分钟降到 **4 分 10 秒**。
      #    ⚠️ **缓存按 ref 分域**：PR 分支与 main 各存各的，每个 ref 的第一次运行
      #    都是冷下载（main 的第一次就跑了 17 分钟）。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install the Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium

      # SQLite 驱动依赖 cgo，ubuntu-latest 自带 gcc。
      - name: Run the portal end-to-end tests
        env:
          CGO_ENABLED: "1"
        run: bash ./scripts/web-e2e.sh run
