name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The browser-side prover acceptance test drives the WASM module through
      # node; without node the test skips itself.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./tests)"
          if [ -n "$out" ]; then
            echo "gofmt failed, these files need formatting:"
            echo "$out"
            exit 1
          fi

      - name: Run Unit/Integration/E2E Tests
        run: go test ./...

      - name: Run Coverage Gate
        run: bash ./scripts/check-coverage.sh 80 coverage.ci.out

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir web run lint

      - name: Type check
        run: pnpm --dir web exec tsc --noEmit

      - name: Unit tests
        run: pnpm --dir web run test
