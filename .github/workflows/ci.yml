name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Unit/Integration/E2E Tests
        run: go test ./...

      - name: Run Coverage Gate
        run: bash ./scripts/check-coverage.sh 80 coverage.ci.out
